<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AKA Assistent</title>
<style>
  :root{
    --ink:#1a1d21; --muted:#6b7280; --line:#e7e7e4;
    --canvas:#fbfbfa; --surface:#ffffff;
    --accent:#185e63; --accent-tint:#e8f0ef;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--canvas);color:var(--ink);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .app{max-width:760px;margin:0 auto;height:100vh;display:flex;flex-direction:column}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:16px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
  .brand{display:flex;align-items:center;gap:10px}
  .mark{width:30px;height:30px;border-radius:8px;background:var(--accent-tint);
    color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:600}
  .brand b{font-size:15px;font-weight:600;display:block}
  .brand span{font-size:12px;color:var(--muted)}
  select{font:14px inherit;padding:7px 10px;border:1px solid var(--line);
    border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer}
  #log{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
  .row{display:flex;flex-direction:column;gap:4px;max-width:86%}
  .row.user{align-self:flex-end;align-items:flex-end}
  .row.bot{align-self:flex-start;align-items:flex-start}
  .msg{padding:10px 14px;border-radius:12px;white-space:pre-wrap}
  .user .msg{background:var(--accent-tint)}
  .bot .msg{background:var(--surface);border:1px solid var(--line)}
  .tag{font-size:11px;color:var(--muted);padding:0 4px}
  footer{padding:14px 20px;border-top:1px solid var(--line);background:var(--surface)}
  .composer{display:flex;gap:8px}
  input[type=text]{flex:1;font:15px inherit;padding:11px 14px;border:1px solid var(--line);
    border-radius:10px;background:var(--canvas);color:var(--ink)}
  input[type=text]:focus{outline:none;border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-tint)}
  button.send{border:none;background:var(--accent);color:#fff;border-radius:10px;
    padding:0 18px;font-size:16px;cursor:pointer}
  button.send:disabled{opacity:.5;cursor:default}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="mark">A</div>
      <div><b>AKA Assistent</b><span>Intern chat · dine data forlader ikke platformen</span></div>
    </div>
    <select id="model" aria-label="Vælg model"></select>
  </header>

  <div id="log"></div>

  <footer>
    <div class="composer">
      <input id="box" type="text" placeholder="Skriv en besked" aria-label="Skriv en besked" autofocus />
      <button class="send" id="send" aria-label="Send">↑</button>
    </div>
  </footer>
</div>

<script>
const log=document.getElementById('log');
const box=document.getElementById('box');
const send=document.getElementById('send');
const model=document.getElementById('model');
const history=[];

// Hent modellisten fra backend, så den kun vedligeholdes ét sted.
fetch('/api/models').then(r=>r.json()).then(d=>{
  d.models.forEach(m=>{
    const o=document.createElement('option');o.value=m;o.textContent=m;model.appendChild(o);
  });
});

function row(role, tagText){
  const wrap=document.createElement('div');
  wrap.className='row '+(role==='user'?'user':'bot');
  const msg=document.createElement('div');msg.className='msg';
  wrap.appendChild(msg);
  if(role!=='user'){
    const tag=document.createElement('div');tag.className='tag';tag.textContent='via '+tagText;
    wrap.appendChild(tag);
  }
  log.appendChild(wrap);log.scrollTop=log.scrollHeight;
  return msg;
}

async function ask(){
  const text=box.value.trim();
  if(!text) return;
  box.value='';send.disabled=true;
  row('user').textContent=text;
  history.push({role:'user',content:text});

  const out=row('bot', model.value);
  out.textContent='…';
  let acc='';

  const res=await fetch('/api/chat',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:model.value,messages:history})
  });
  const reader=res.body.getReader();const dec=new TextDecoder();
  let buf='';
  while(true){
    const {value,done}=await reader.read();if(done)break;
    buf+=dec.decode(value,{stream:true});
    const lines=buf.split('\n\n');buf=lines.pop();
    for(const line of lines){
      if(!line.startsWith('data: '))continue;
      const data=line.slice(6);
      if(data==='[DONE]')continue;
      try{const j=JSON.parse(data);acc+=j.text;out.textContent=acc;log.scrollTop=log.scrollHeight;}catch(e){}
    }
  }
  history.push({role:'assistant',content:acc});
  send.disabled=false;box.focus();
}

send.addEventListener('click',ask);
box.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();ask();}});
</script>
</body>
</html>

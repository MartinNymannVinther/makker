# Hver model, der skal kunne vælges i chatten. Tilføj en model = fire linjer.
# api_key peger på miljøvariabler, så nøgler ikke står i filen.
model_list:
  - model_name: Claude Sonnet
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: Claude Opus
    litellm_params:
      model: anthropic/claude-opus-4-8
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: Mistral Large
    litellm_params:
      model: mistral/mistral-large-latest
      api_key: os.environ/MISTRAL_API_KEY

  - model_name: Mistral Small
    litellm_params:
      model: mistral/mistral-small-latest
      api_key: os.environ/MISTRAL_API_KEY

# Slår forbrugslogning til, så vi kan se tokens pr. model og pr. bruger.
litellm_settings:
  success_callback: ["langfuse"]   # valgfrit — fjern hvis I ikke bruger det
